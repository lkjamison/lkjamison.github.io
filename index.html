<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laura Jamison</title>
    <style>
        body {
            font-family: Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Styling for the black banner */
        .banner {
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .banner h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons a {
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            background-color: #555;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .nav-buttons a:hover {
            background-color: #777;
        }

        /* Styling for the main content */
        .content {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            text-align: left;
        }

        .quote {
            font-style: italic;
            margin-bottom: 10px;
            font-size: 1.2em;
            width: 45%;
            text-align: right;
        }

        .quote span {
            display: block;
            margin-top: 10px;
            font-size: 0.9em;
            color: gray;
        }

        .description {
            font-size: 1em;
            color: #333;
            width: 45%;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>
    <!-- Black banner with navigation -->
    <div class="banner">
        <h1>Laura Jamison</h1>
        <div class="nav-buttons">
            <a href="about.html">About Me</a>
            <a href="tutorials.html">Tutorials</a>
        </div>
    </div>

    <!-- Main content of the page -->
    <div class="grid-container">
        <img src="Image 1.jpg" width="300" height="200" alt="Image">
        <p>
        <div class="quote">The tasks I would set for you?<br>
                Beware how bias lurks!<br>
                Weigh well the options that are yours<br>
                Pursuing Nature's quirks.
                <span class="citation">- John Nesselroade, Psychologists Doing Empirical Research - Selection at Work! (2011)</span></p>
    </div>
</body>
</html>
