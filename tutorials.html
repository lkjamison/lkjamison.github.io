<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorials</title>
    <style>
        body {
            font-family: Helvetica, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Styling for the black banner */
        .banner {
            background-color: black;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .banner h1 {
            margin: 0;
            font-size: 1.5em;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons a {
            text-decoration: none;
            color: white;
            padding: 10px 15px;
            background-color: #555;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        .nav-buttons a:hover {
            background-color: #777;
        }

        /* Styling for the main content */
        .content {
            padding: 20px;
        }

        .repo-list {
            list-style-type: none;
            padding: 0;
        }

        .repo-list li {
            margin: 5px 0;
        }

        .repo-list a {
            text-decoration: none;
            color: #007BFF;
        }

        .repo-list a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Black banner with navigation -->
    <div class="banner">
        <h1>Laura Jamison</h1>
        <div class="nav-buttons">
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
        </div>
    </div>

    <!-- Main content of the page -->
    <div class="content">
        <h2>Tutorials</h2>
        <p>Below are links to my GitHub repositories, listed in alphabetical order:</p>
        <ul class="repo-list">
            <li><a href="https://github.com/yourusername/repo1" target="_blank">Repo 1</a></li>
            <li><a href="https://github.com/yourusername/repo2" target="_blank">Repo 2</a></li>
            <li><a href="https://github.com/yourusername/repo3" target="_blank">Repo 3</a></li>
            <!-- Add more repositories as needed -->
        </ul>
    </div>
</body>
</html>
